name: Tests

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: j2m_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d j2m_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/j2m_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install rclone for synthetic retention tests
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends rclone
      - name: Verify PostgreSQL 17 trust store for verify-full backups
        run: docker run --rm --network none postgres:17-alpine sh -eu -c 'test -s /etc/ssl/certs/ca-certificates.crt'
      - run: npm ci
      - run: npm run build:css
      - run: git diff --exit-code -- app/static/css/tailwind.min.css
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.lock
      - run: python -m pip check
      - run: flask --app run.py staging-preflight --help
      - run: python -m unittest discover tests -v
      - run: docker compose --env-file .env.selfhost.example -f compose.selfhost.yml config --quiet
        env:
          J2M_ENV_FILE: .env.selfhost.example
          J2M_CLOUDFLARED_ENV_FILE: .env.cloudflared.example
      - run: docker compose -p j2m-pr70-ci --env-file .env.selfhost.test.example -f compose.selfhost.yml -f compose.selfhost.test.yml config --quiet
        env:
          J2M_IMAGE: j2m-interactive:pr70-ci
      - run: docker compose -p j2m-pr70-production-ci --env-file .env.selfhost.production-test.example -f compose.selfhost.yml -f compose.selfhost.test.yml -f compose.selfhost.production-test.yml config --quiet
      - run: docker compose -p j2m-pr70-loopback-ci --env-file .env.selfhost.production-test.example -f compose.selfhost.yml -f compose.selfhost.test.yml -f compose.selfhost.production-test.yml -f compose.selfhost.loopback-test.yml config --quiet
      - run: docker build --tag j2m-staging:test .
      - name: Verify joint PostgreSQL and media restoration in isolated Docker resources
        run: |
          docker tag j2m-staging:test j2m-interactive:0000000000000000000000000000000000000001
          python tests/integral_restore_ci.py
      - run: docker build --file Dockerfile.postgres-test --tag j2m-postgres:production-test .
