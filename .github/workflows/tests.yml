name: Tests

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: j2m_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d j2m_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/j2m_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - run: git diff --exit-code -- app/static/css/tailwind.min.css
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.lock
      - run: python -m pip check
      - run: flask --app run.py staging-preflight --help
      - run: python -m unittest discover tests -v
      - run: docker build --tag j2m-staging:test .
