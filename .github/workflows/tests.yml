name: Tests

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: j2m_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d j2m_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/j2m_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install rclone for synthetic retention tests
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends rclone
      - name: Verify PostgreSQL 17 trust store for verify-full backups
        run: docker run --rm --network none postgres:17-alpine sh -eu -c 'test -s /etc/ssl/certs/ca-certificates.crt'
      - run: npm ci
      - run: npm run build:css
      - run: git diff --exit-code -- app/static/css/tailwind.min.css
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.lock
      - run: python -m pip check
      - run: flask --app run.py staging-preflight --help
      - run: python -m scripts.probe_wallet_session_affinity
      - name: Verify transition inventory, exact restore and pooler guards
        run: |
          python -m unittest discover tests -p 'test_selfhost_transition_preflight.py' -v
          python -m unittest discover tests -p 'test_probe_authorized_pooler.py' -v
          python -m unittest discover tests -p 'test_verify_transition_restore.py' -v
          python -m unittest discover tests -p 'test_restore_process_stream.py' -v
          python -m compileall -q scripts tests
          git diff --check HEAD^ HEAD
      - run: python -m unittest discover tests -v
      - run: docker compose --env-file .env.selfhost.example -f compose.selfhost.yml config --quiet
        env:
          J2M_ENV_FILE: .env.selfhost.example
          J2M_CLOUDFLARED_ENV_FILE: .env.cloudflared.example
      - run: docker compose -p j2m-pr70-ci --env-file .env.selfhost.test.example -f compose.selfhost.yml -f compose.selfhost.test.yml config --quiet
        env:
          J2M_IMAGE: j2m-interactive:pr70-ci
      - run: docker compose -p j2m-pr70-production-ci --env-file .env.selfhost.production-test.example -f compose.selfhost.yml -f compose.selfhost.test.yml -f compose.selfhost.production-test.yml config --quiet
      - run: docker compose -p j2m-pr70-loopback-ci --env-file .env.selfhost.production-test.example -f compose.selfhost.yml -f compose.selfhost.test.yml -f compose.selfhost.production-test.yml -f compose.selfhost.loopback-test.yml config --quiet
      - run: docker build --tag j2m-staging:test .
      - name: Start isolated Wallet Demo rehearsal with Wallet disabled
        run: |
          docker tag j2m-staging:test j2m-interactive:wallet-demo-synthetic
          demo=(docker compose -p j2m-wallet-demo -f compose.wallet-demo.yml -f compose.wallet-demo.persistent.yml)
          "${demo[@]}" config --quiet
          trap '"${demo[@]}" down' EXIT
          "${demo[@]}" up -d --wait --wait-timeout 120
          python -c 'from scripts.check_wallet_demo_readiness import runtime; runtime(persistent=True)'
          before=$("${demo[@]}" exec -T db psql -U j2m_test -d j2m_test -Atc 'SELECT system_identifier FROM pg_control_system()')
          "${demo[@]}" down
          "${demo[@]}" up -d --wait --wait-timeout 120
          after=$("${demo[@]}" exec -T db psql -U j2m_test -d j2m_test -Atc 'SELECT system_identifier FROM pg_control_system()')
          test -n "$before" && test "$before" = "$after"
          "${demo[@]}" exec -T app python -c "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/api/ready', timeout=5).status == 200"
      - name: Verify restricted Wallet egress against synthetic TLS endpoints
        run: python tests/wallet_egress_ci.py
      - name: Verify isolated Nginx upstream recovery and rollback
        run: python tests/nginx_recovery_ci.py
      - name: Verify joint PostgreSQL and media restoration in isolated Docker resources
        run: |
          docker tag j2m-staging:test j2m-interactive:0000000000000000000000000000000000000001
          python tests/integral_restore_ci.py
      - run: docker build --file Dockerfile.postgres-test --tag j2m-postgres:production-test .

  powershell-syntax:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows self-hosting deployment scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'scripts/selfhost_deploy_approved.ps1',
            'scripts/invoke_selfhost_compose.ps1',
            'scripts/set_selfhost_image_pin.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD.Path $path), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse failed: $path"
            }
          }
          $approved = 'j2m-interactive:' + ('a' * 40)
          if (-not ($approved -cmatch '^j2m-interactive:([0-9a-f]{40})$')) {
            throw 'Approved image tag regex was not accepted.'
          }
          if ($Matches[1] -cne ('a' * 40)) {
            throw 'PowerShell SHA capture did not match the approved tag.'
          }
