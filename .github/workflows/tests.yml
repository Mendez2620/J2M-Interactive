name: Tests

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - run: git diff --exit-code -- app/static/css/tailwind.min.css
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.lock
      - run: python -m unittest discover tests -v
      - run: docker build --tag j2m-staging:test .
