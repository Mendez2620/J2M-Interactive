{% extends "base.html" %}
{% block title %}Acceso administrativo | J2M Interactive{% endblock %}
{% block content %}
<main class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
  <section class="w-full max-w-md rounded-2xl bg-white border border-slate-200 shadow-xl p-8">
    <h1 class="text-2xl font-bold text-slate-900">Administración J2M</h1>
    <p class="text-sm text-slate-500 mt-1 mb-6">Acceso exclusivo para administradores globales.</p>
    {% if error %}<div class="mb-4 rounded-lg bg-red-50 text-red-700 px-4 py-3 text-sm">{{ error }}</div>{% endif %}
    <form method="POST" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div><label class="block text-sm font-semibold mb-1">Correo electrónico</label><input type="email" name="email" required autocomplete="username" class="w-full rounded-lg border border-slate-300 px-3 py-2"></div>
      <div><label class="block text-sm font-semibold mb-1">Contraseña</label><input type="password" name="password" required autocomplete="current-password" class="w-full rounded-lg border border-slate-300 px-3 py-2"></div>
      <button class="w-full rounded-lg bg-slate-900 text-white py-2.5 font-semibold hover:bg-slate-800">Iniciar sesión</button>
    </form>
  </section>
</main>
{% endblock %}
