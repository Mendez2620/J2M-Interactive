<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token() }}"><title>Acceso seguro</title><link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.min.css') }}"></head>
<body class="min-h-screen bg-slate-50 p-6"><main class="mx-auto max-w-lg rounded-2xl bg-white p-6 shadow" data-customer-login data-business-slug="{{ business.slug }}"><h1 class="text-xl font-bold">Acceso seguro a {{ business.name }}</h1><p class="mt-3 text-sm text-slate-600">Utiliza una passkey vinculada previamente con asistencia del negocio.</p><button type="button" data-login-passkey class="mt-5 w-full rounded-xl bg-slate-900 px-4 py-3 font-semibold text-white">Entrar con passkey</button><p class="mt-3 text-sm" role="status" data-auth-status></p></main><script src="{{ url_for('static', filename='js/customer-passkeys.js') }}" defer></script></body></html>
