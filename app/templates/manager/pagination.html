{% if pagination.pages > 1 %}<nav class="flex justify-between items-center mt-4 text-sm"><span>Página {{ pagination.page }} de {{ pagination.pages }}</span><div class="flex gap-2">{% if pagination.has_prev %}<a class="border rounded-lg px-3 py-2" href="?page={{ pagination.prev_num }}&q={{ request.args.get('q','') }}&type={{ request.args.get('type','') }}">Anterior</a>{% endif %}{% if pagination.has_next %}<a class="border rounded-lg px-3 py-2" href="?page={{ pagination.next_num }}&q={{ request.args.get('q','') }}&type={{ request.args.get('type','') }}">Siguiente</a>{% endif %}</div></nav>{% endif %}
