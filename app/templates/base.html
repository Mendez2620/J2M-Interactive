<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}J2M Interactive - Tarjetas de Lealtad{% endblock %}</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="h-full flex flex-col text-slate-900 antialiased selection:bg-indigo-500 selection:text-white">
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
  <script>
    document.querySelectorAll('form[method="POST"]').forEach((form) => {
      if (!form.querySelector('input[name="csrf_token"]')) {
        const input = document.createElement('input');
        input.type = 'hidden'; input.name = 'csrf_token';
        input.value = document.querySelector('meta[name="csrf-token"]').content;
        form.appendChild(input);
      }
    });
  </script>
</body>
</html>
