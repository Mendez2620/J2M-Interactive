<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}J2M Interactive - Tarjetas de Lealtad{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.min.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="h-full flex flex-col text-slate-900 antialiased selection:bg-indigo-500 selection:text-white">
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
  <script nonce="{{ csp_nonce() }}">
    document.querySelectorAll('form[method="POST"]').forEach((form) => {
      if (!form.querySelector('input[name="csrf_token"]')) {
        const input = document.createElement('input');
        input.type = 'hidden'; input.name = 'csrf_token';
        input.value = document.querySelector('meta[name="csrf-token"]').content;
        form.appendChild(input);
      }
    });
  </script>
  <script src="{{ url_for('static', filename='js/legacy-actions.js') }}"></script>
</body>
</html>
