<section class="mx-auto max-w-3xl space-y-4" data-web-scanner>
  <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between"><div><h1 class="text-xl font-bold text-slate-900">Escáner QR</h1><p class="text-sm text-slate-500">{{ business.name }} · La lectura no registra movimientos automáticamente.</p></div><button type="button" class="btn btn-primary" data-start-camera>{{ icon('camera') }} Iniciar escáner</button></div>
    <div class="mt-4 hidden space-y-3" data-camera-panel><div class="relative aspect-square max-h-[480px] overflow-hidden rounded-2xl bg-slate-950"><div id="webQrReader" class="h-full w-full" data-qr-reader></div><div class="pointer-events-none absolute inset-[12%] rounded-2xl border-2 border-dashed border-emerald-400" aria-hidden="true"></div></div><div class="flex flex-col gap-2 sm:flex-row"><label class="text-sm flex-1">Cámara<select class="field mt-1" data-camera-select aria-label="Seleccionar cámara"></select></label><button type="button" class="btn btn-secondary self-end" data-stop-camera>Detener cámara</button></div></div>
    <div class="mt-4 border-t pt-4"><label class="text-sm font-semibold" for="manualQrToken">Ingreso alternativo del código</label><div class="mt-1 flex flex-col gap-2 sm:flex-row"><input id="manualQrToken" type="text" class="field flex-1" autocomplete="off" data-manual-token placeholder="Contenido del QR"><button type="button" class="btn btn-secondary" data-lookup-manual>Consultar</button></div><p class="mt-1 text-xs text-slate-500">Úsalo solo si la cámara no está disponible. El código no se guarda en el navegador.</p></div>
  </div>

  <div class="hidden rounded-2xl border border-slate-200 bg-white p-5 shadow-sm" data-customer-panel>
    <div class="flex items-start justify-between gap-3 border-b pb-4"><div><p class="text-xs font-semibold uppercase text-indigo-600">Cliente encontrado</p><h2 class="text-lg font-bold" data-customer-name></h2></div><div class="text-right"><p class="text-xs text-slate-500">Saldo confirmado</p><strong class="text-lg" data-customer-balance></strong></div></div>
    <div class="mt-4 hidden space-y-3" data-stamps-actions><p class="text-sm text-slate-600">Confirma expresamente la operación.</p><div class="grid grid-cols-1 gap-2 sm:grid-cols-2"><button type="button" class="btn btn-primary" data-action="earn_stamp">Agregar 1 sello</button><button type="button" class="btn btn-danger" data-action="redeem_stamp">Canjear recompensa</button></div></div>
    <div class="mt-4 hidden space-y-3" data-points-actions><label class="block text-sm font-semibold">Monto de compra<input type="number" min="0.01" step="0.01" class="field mt-1" data-purchase-amount placeholder="0.00"></label><button type="button" class="btn btn-primary w-full" data-action="earn_points">Registrar compra y acreditar puntos</button><label class="block text-sm font-semibold">Puntos a canjear<input type="number" min="0.000001" step="0.000001" class="field mt-1" data-redeem-amount placeholder="0"></label><button type="button" class="btn btn-danger w-full" data-action="redeem_points">Canjear puntos</button></div>
    <button type="button" class="mt-4 text-sm font-semibold text-slate-600" data-reset-scanner>Escanear otro cliente</button>
  </div>
  <div class="hidden rounded-xl p-3 text-sm" role="status" aria-live="polite" data-scanner-status></div>
</section>
