# Standalone synthetic rehearsal. Wallet modes and the database target are fixed.
name: j2m-wallet-demo

x-demo-app: &demo-app
  image: j2m-interactive:wallet-demo-synthetic
  pull_policy: never
  env_file: .env.wallet-demo.example
  environment:
    DATABASE_URL: postgresql://j2m_test:j2m-demo-synthetic-only@db:5432/j2m_test
    GOOGLE_WALLET_MODE: disabled
    GOOGLE_WALLET_RECONCILIATION_ENABLED: "false"
    APPLE_WALLET_MODE: disabled
  networks: [synthetic]
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: j2m_test
      POSTGRES_USER: j2m_test
      POSTGRES_PASSWORD: j2m-demo-synthetic-only
    networks: [synthetic]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD, pg_isready, -U, j2m_test, -d, j2m_test]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    <<: *demo-app
    command: [flask, --app, run.py, db, upgrade]
    healthcheck:
      disable: true
  app:
    <<: *demo-app
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:18443:8000
    volumes:
      - media:/app/instance/media

networks:
  synthetic:
    internal: true

volumes:
  media:
