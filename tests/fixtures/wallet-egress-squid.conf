visible_hostname j2m-wallet-egress
http_port 3128
acl wallet_connect method CONNECT
acl wallet_tls port 443
acl wallet_host dstdom_regex -n -i ^oauth2\.googleapis\.com$ ^walletobjects\.googleapis\.com$
http_access allow wallet_connect wallet_tls wallet_host
http_access deny all
cache deny all
access_log none
