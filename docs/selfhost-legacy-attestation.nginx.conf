# Include in the http context. Scope the extra log to health and ready.
map "$uri:$http_x_j2m_probe" $j2m_attest_log {
    default 0;
    "~^/api/(health|ready):[0-9a-f]{48}$" 1;
}
log_format j2m_attest '$http_x_j2m_probe $uri $upstream_addr $upstream_status';
# Add alongside the existing access_log in the HTTPS server:
# access_log /dev/stdout j2m_attest if=$j2m_attest_log;
