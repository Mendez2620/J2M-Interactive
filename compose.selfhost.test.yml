services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: j2m_test
      POSTGRES_USER: j2m_test
      POSTGRES_PASSWORD: j2m-isolated-test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U j2m_test -d j2m_test"]
      interval: 5s
      timeout: 5s
      retries: 12
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - j2m-private

  web:
    depends_on:
      postgres-test:
        condition: service_healthy

  google-wallet-worker:
    depends_on:
      postgres-test:
        condition: service_healthy

  migrator:
    depends_on:
      postgres-test:
        condition: service_healthy
